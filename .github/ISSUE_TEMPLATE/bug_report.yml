name: Bug report
description: Something is wrong with an image or how it is built
labels: [bug]
body:
  - type: input
    id: image
    attributes:
      label: Image
      description: The full image reference, ideally with the digest. Get it with `docker image inspect --format '{{index .RepoDigests 0}}' <image>`.
      placeholder: nvitaterna/nodejs-distroless:22.23.4@sha256:...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - linux/amd64
        - linux/arm64
        - both
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Where it runs
      placeholder: e.g. Docker 29 on Ubuntu, Kubernetes 1.34, AWS ECS
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include any error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal Dockerfile, `docker run` command or script that shows the problem.
      render: Dockerfile
  - type: textarea
    id: other-images
    attributes:
      label: Does it happen with other images?
      description: For example with `node:22-slim` on the same Node.js version. This tells us whether it is specific to this image.
