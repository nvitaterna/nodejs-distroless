name: Publish

# Publishes images whenever something that goes into them lands on main.
# Which versions get (re)built:
#   - the image definition changed since the last publish  -> every version
#   - only versions.json changed                            -> new/changed versions
#   - manual run with "all"                                  -> every version
#   - manual run with "versions"                             -> just those
# "Last publish" is recorded on the orphan `published` branch (the commit
# that was published plus its versions.json), written by the final job of
# each successful full or incremental run, so a run that is skipped or fails
# is caught up by the next one. A branch with only those two files is used
# rather than a tag because moving a ref across commits that touch workflow
# files needs a token with workflow scope; this branch's diffs never do.
on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - versions.json
      - test/**
      - .github/workflows/publish.yml
      - .github/actions/**
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild and publish every version
        type: boolean
        default: false
      versions:
        description: Comma-separated versions to publish (ignored when "all" is set)
        type: string
        default: ""

# serialise publishes so a later run can't be overtaken by an earlier one
concurrency: production

env:
  # published to both; the build pushes each arch to both by digest and the
  # push job tags the manifest list in both
  DOCKERHUB_IMAGE: nvitaterna/${{ vars.REGISTRY_IMAGE }}
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ vars.REGISTRY_IMAGE }}
  TEST_TAG: nvitaterna/${{ vars.REGISTRY_IMAGE }}:test

jobs:
  configure:
    name: Pick versions to publish
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      # "all" or "changed" runs update the `published` branch at the end, "explicit" runs don't
      mode: ${{ steps.set-matrix.outputs.mode }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set matrix data
        id: set-matrix
        env:
          INPUT_ALL: ${{ inputs.all }}
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          # what goes into the images; the workflow itself is deliberately not here
          image_paths=(Dockerfile test .github/actions)
          if [[ "$INPUT_ALL" == "true" ]]; then
            mode=all
          elif [[ -n "$INPUT_VERSIONS" ]]; then
            mode=explicit
          elif ! git rev-parse -q --verify 'origin/published^{commit}' > /dev/null \
            || ! published=$(git show origin/published:commit 2> /dev/null) \
            || ! git rev-parse -q --verify "${published}^{commit}" > /dev/null; then
            echo "No published marker yet: publishing every version"
            mode=all
          elif ! git diff --quiet "$published" HEAD -- "${image_paths[@]}"; then
            echo "Image definition changed since the last publish: publishing every version"
            mode=all
          else
            mode=changed
          fi

          case "$mode" in
            all)
              matrix=$(jq -c '. | reverse' versions.json) ;;
            explicit)
              wanted=$(jq -c -n --arg v "$INPUT_VERSIONS" '$v | split(",") | map(gsub("^\\s+|\\s+$"; ""))')
              matrix=$(jq -c --argjson wanted "$wanted" 'map(select(.version as $v | $wanted | index($v))) | reverse' versions.json) ;;
            changed)
              git show origin/published:versions.json > old.versions.json
              matrix=$(jq -c -n '[inputs] as $files | ($files[0] - $files[1]) | reverse' versions.json old.versions.json) ;;
          esac

          if [[ "$matrix" == "[]" ]]; then
            if [[ "$mode" == "changed" ]]; then
              # e.g. only a workflow file changed: nothing to build, but move the tag
              echo "Nothing to publish since the last publish."
              mode=noop
            else
              echo "::error::No versions matched."
              exit 1
            fi
          fi
          echo "Mode: $mode"
          [[ "$mode" != noop ]] && echo "Publishing: $(jq -r 'map(.version) | join(", ")' <<< "$matrix")"
          {
            echo "mode=$mode"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"

  base:
    name: Build base on ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
    if: needs.configure.outputs.mode != 'noop'
    needs:
      - configure
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # built once per arch and handed to every version build as an OCI
      # layout, so all versions in a run share the exact same base. Cached in
      # the GitHub Actions cache: PR runs read main's entries and write their
      # own, and entries unused for 7 days are evicted. Version builds are not
      # cached: a new version has nothing to reuse, and after a base change
      # only the tarball unpack would be (the tarball itself is on node-dist)
      - name: Build base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: base
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/oci/base
          cache-from: type=gha,scope=base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=base-${{ matrix.platform.os }}-${{ matrix.platform.arch }},mode=max

      # what the debug variant adds (busybox); it shares the base's builder
      # stage, so this reuses what the previous step just built
      - name: Build debug tools
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: debug-tools
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/oci/debug-tools
          cache-from: |
            type=gha,scope=base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
            type=gha,scope=debug-tools-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=debug-tools-${{ matrix.platform.os }}-${{ matrix.platform.arch }},mode=max

      - name: Upload base
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/oci
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and test v${{ matrix.version.version }} on ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
    if: needs.configure.outputs.mode != 'noop'
    needs:
      - configure
      - base
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      # one broken version must not stop the others from being published
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.configure.outputs.matrix) }}
        platform:
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch Node.js tarball
        id: node-dist
        uses: ./.github/actions/node-dist
        with:
          version: ${{ matrix.version.version }}
          arch: ${{ matrix.platform.arch }}

      - name: Download base
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/oci

      - name: Resolve base
        id: base
        env:
          OCI: ${{ runner.temp }}/oci
        run: |
          for name in base debug-tools; do
            digest=$(jq -r '.manifests[0].digest' "$OCI/$name/index.json")
            echo "$name=$name=oci-layout://$OCI/$name@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          labels: |
            NODEJS_VERSION=${{ matrix.version.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # both variants are built in this job rather than as a matrix dimension:
      # a full publish is already close to the 256-job matrix limit
      - name: Build and export to docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: release
          load: true
          push: false
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            NODE_DIST_URL=${{ steps.node-dist.outputs.url }}
          build-contexts: ${{ steps.base.outputs.base }}
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TEST_TAG }}

      - name: Test Docker image
        env:
          PLATFORM: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          EXPECTED_NODE_VERSION: ${{ matrix.version.version }}
        run: |
          docker run --platform "$PLATFORM" --rm \
            -v "$PWD/test/check.js:/check.js:ro" \
            -e EXPECTED_NODE_VERSION \
            "$TEST_TAG" /check.js

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: release
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            NODE_DIST_URL=${{ steps.node-dist.outputs.url }}
          build-contexts: ${{ steps.base.outputs.base }}
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Build and export debug variant to docker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: debug
          load: true
          push: false
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            NODE_DIST_URL=${{ steps.node-dist.outputs.url }}
          build-contexts: |
            ${{ steps.base.outputs.base }}
            ${{ steps.base.outputs.debug-tools }}
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TEST_TAG }}-debug

      - name: Test debug variant
        env:
          PLATFORM: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          EXPECTED_NODE_VERSION: ${{ matrix.version.version }}
        run: |
          docker run --platform "$PLATFORM" --rm \
            -v "$PWD/test/check.js:/check.js:ro" \
            -e EXPECTED_NODE_VERSION \
            "$TEST_TAG-debug" /check.js
          docker run --platform "$PLATFORM" --rm --entrypoint sh \
            "$TEST_TAG-debug" -c 'test "$(id -u)" = 1000 && ls /home/node > /dev/null && wget --help 2>&1 | grep -q Usage'

      - name: Push debug variant by digest
        id: build-debug
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: debug
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            NODE_DIST_URL=${{ steps.node-dist.outputs.url }}
          build-contexts: |
            ${{ steps.base.outputs.base }}
            ${{ steps.base.outputs.debug-tools }}
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Export digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DEBUG_DIGEST: ${{ steps.build-debug.outputs.digest }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          mkdir -p "$DIGESTS/release" "$DIGESTS/debug"
          touch "$DIGESTS/release/${DIGEST#sha256:}" "$DIGESTS/debug/${DEBUG_DIGEST#sha256:}"

      - name: Upload digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests-${{ matrix.version.version }}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push ${{ matrix.version.version }}
    # runs even when some builds failed: versions whose builds all passed
    # are published, the others are skipped and the run stays red
    if: ${{ !cancelled() && needs.configure.result == 'success' && needs.configure.outputs.mode != 'noop' }}
    needs:
      - configure
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write # keyless signing with cosign
    strategy:
      max-parallel: 1
      matrix:
        version: ${{ fromJson(needs.configure.outputs.matrix) }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.version.version }}-*
          merge-multiple: true

      # each arch build uploads one release and one debug digest only when
      # everything in it passed; the directories do not exist when no arch did
      - name: Check that every arch was built
        id: digests
        env:
          VERSION: ${{ matrix.version.version }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          for variant in release debug; do
            mkdir -p "$DIGESTS/$variant"
            n=$(find "$DIGESTS/$variant" -maxdepth 1 -type f | wc -l)
            if [[ "$n" -ne 2 ]]; then
              echo "::warning::v$VERSION: only $n of 2 arch builds succeeded, not publishing it in this run"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Login to Docker Hub
        if: steps.digests.outputs.skip != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: steps.digests.outputs.skip != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: steps.digests.outputs.skip != 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # the per-arch images were pushed to both registries by digest, so one
      # manifest list built from the Docker Hub copies is tagged in both, with
      # the same digest. The debug variant gets every tag with a -debug suffix
      # (22-debug, latest-debug). The manifest list carries OCI annotations,
      # which is where registries (GHCR in particular) look for a multi-arch
      # image's description and source. Each manifest list and the images in
      # it are then signed with cosign, keyless: the signature is tied to this
      # workflow's identity through GitHub's OIDC token and logged in Rekor
      - name: Create manifest lists, push and sign
        if: steps.digests.outputs.skip != 'true'
        env:
          VERSION: ${{ matrix.version.version }}
          TAGS: ${{ toJSON(matrix.version.tags) }}
          DIGESTS: ${{ runner.temp }}/digests
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for variant in release debug; do
            suffix=""
            description="Distroless Node.js $VERSION, built from Ubuntu LTS with Canonical's Chisel"
            if [[ "$variant" == debug ]]; then
              suffix=-debug
              description="$description, with a BusyBox shell for debugging"
            fi
            annotations=(
              "org.opencontainers.image.title=nodejs-distroless"
              "org.opencontainers.image.description=$description"
              "org.opencontainers.image.version=$VERSION$suffix"
              "org.opencontainers.image.source=$REPO_URL"
              "org.opencontainers.image.url=$REPO_URL"
              "org.opencontainers.image.documentation=$REPO_URL#readme"
              "org.opencontainers.image.revision=$GITHUB_SHA"
              "org.opencontainers.image.created=$created"
              "org.opencontainers.image.licenses=MIT"
            )
            annotation_args=()
            for annotation in "${annotations[@]}"; do
              annotation_args+=(--annotation "index:$annotation")
            done
            mapfile -t tag_args < <(jq -r --arg hub "$DOCKERHUB_IMAGE" --arg ghcr "$GHCR_IMAGE" --arg suffix "$suffix" \
              '.[] | ("-t", "\($hub):\(.)\($suffix)", "-t", "\($ghcr):\(.)\($suffix)")' <<< "$TAGS")
            mapfile -t sources < <(cd "$DIGESTS/$variant" && printf "$DOCKERHUB_IMAGE@sha256:%s\n" *)
            docker buildx imagetools create "${annotation_args[@]}" "${tag_args[@]}" "${sources[@]}"

            digest=$(docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$VERSION$suffix" --format '{{.Manifest.Digest}}')
            ghcr_digest=$(docker buildx imagetools inspect "$GHCR_IMAGE:$VERSION$suffix" --format '{{.Manifest.Digest}}')
            if [[ "$digest" != "$ghcr_digest" ]]; then
              echo "::error::v$VERSION$suffix: Docker Hub ($digest) and GHCR ($ghcr_digest) digests differ"
              exit 1
            fi
            cosign sign --yes --recursive "$DOCKERHUB_IMAGE@$digest" "$GHCR_IMAGE@$digest"
            echo "v$VERSION$suffix: $digest" >> "$GITHUB_STEP_SUMMARY"
          done

  mark-published:
    name: Mark commit as published
    # only when every version was built and pushed; otherwise the marker stays
    # put and the next run rebuilds everything (the base from the cache)
    if: ${{ !cancelled() && needs.configure.result == 'success' && needs.configure.outputs.mode != 'explicit' && (needs.configure.outputs.mode == 'noop' || (needs.build.result == 'success' && needs.push.result == 'success')) }}
    needs:
      - configure
      - build
      - push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the next run diffs against this commit to find what still needs
      # publishing; an orphan commit with just these two files, so GITHUB_TOKEN
      # can push it (no workflow files in the diff)
      - name: Record the published commit
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          tree=$(mktemp -d)
          echo "$GITHUB_SHA" > "$tree/commit"
          cp versions.json "$tree/versions.json"
          git --work-tree="$tree" read-tree --empty
          git --work-tree="$tree" add commit versions.json
          marker=$(git commit-tree "$(git write-tree)" -m "published $GITHUB_SHA")
          git push --force origin "$marker:refs/heads/published"
