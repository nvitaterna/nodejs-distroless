name: Update Docker Hub Description

on:
  push:
    branches:
      - main
    paths:
      - README.md
  # the short description comes from the GitHub repository description, which
  # can change without a README change; run this by hand to sync it
  workflow_dispatch:

# its own group: sharing "production" with the publish workflow meant a
# README change could cancel a waiting publish run (GitHub keeps only one
# pending run per group) and wait behind a full publish. Within this group a
# newer README replacing a waiting older one is fine: the newest one wins
concurrency: dockerhub-description

jobs:
  dockerHubDescription:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Docker Hub Description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: nvitaterna/${{ vars.REGISTRY_IMAGE }}
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true
