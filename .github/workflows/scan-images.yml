name: Scan published images

# Daily vulnerability scan of the newest image of each published Node.js
# line, and of its debug variant. Results go to the repository's Security tab (code scanning), one
# category per line, so there is a history and alerts without any extra
# infrastructure. PR builds are scanned separately before merge.
on:
  schedule:
    - cron: "17 6 * * *" # daily
  workflow_dispatch:

permissions: {}

jobs:
  lines:
    name: Published lines
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      majors: ${{ steps.majors.outputs.majors }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: List published lines
        id: majors
        run: |
          majors=$(jq -c '[.[].version | split(".")[0] | tonumber] | unique | map(tostring)' versions.json)
          echo "Scanning: $majors"
          echo "majors=$majors" >> "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.major }}${{ matrix.suffix }}
    needs: lines
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
    strategy:
      fail-fast: false
      matrix:
        major: ${{ fromJson(needs.lines.outputs.majors) }}
        suffix: ["", "-debug"]
    steps:
      - name: Scan nvitaterna/nodejs-distroless:${{ matrix.major }}${{ matrix.suffix }}
        id: scan
        uses: anchore/scan-action@11983a512817154c80a9db660c1a184be7513ed6 # v7.4.3
        with:
          image: nvitaterna/nodejs-distroless:${{ matrix.major }}${{ matrix.suffix }}
          fail-build: false
          severity-cutoff: medium
          by-cve: true
          output-format: sarif
          cache-db: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-${{ matrix.major }}${{ matrix.suffix }}
