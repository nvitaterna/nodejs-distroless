name: Check version-info tool

# runs on every PR so it can be a required check; the steps only run when
# the tool changed
on:
  pull_request:

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter
    defaults:
      run:
        working-directory: tools/version-info
    steps:
      - name: Get changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            tool:
              - 'tools/version-info/**'
              - '.github/workflows/pr-check-tool.yml'

      - name: Check out the repo
        if: steps.changes.outputs.tool == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        if: steps.changes.outputs.tool == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Set up pnpm
        if: steps.changes.outputs.tool == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
          package_json_file: tools/version-info/package.json

      - name: Install dependencies
        if: steps.changes.outputs.tool == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        if: steps.changes.outputs.tool == 'true'
        run: pnpm lint

      - name: Run tests
        if: steps.changes.outputs.tool == 'true'
        run: pnpm test

      - name: Build and run
        if: steps.changes.outputs.tool == 'true'
        run: |
          pnpm build
          node dist | jq -e 'length > 0' > /dev/null
