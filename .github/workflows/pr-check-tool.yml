name: Check version-info tool

on:
  pull_request:
    paths:
      - tools/version-info/**
      - .github/workflows/pr-check-tool.yml

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/version-info
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10
          package_json_file: tools/version-info/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build and run
        run: |
          pnpm build
          node dist | jq -e 'length > 0' > /dev/null
