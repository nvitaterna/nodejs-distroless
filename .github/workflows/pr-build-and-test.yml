name: Build and test new or changed versions

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - versions.json
      - Dockerfile

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      safeRefName: ${{ steps.safeRefName.outputs.REF }}
    steps:
      - name: Get changed paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: changes
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'
      - name: Checkout current ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          path: "./new"
      - name: Checkout target ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: "./old"
      # always build new and changed versions; when the Dockerfile changes also
      # build the oldest and newest version of each major instead of every
      # version (the publish workflows still build every version they release)
      - name: Set matrix data
        id: set-matrix
        env:
          DOCKERFILE_CHANGED: ${{ steps.changes.outputs.dockerfile }}
        run: |
          changed=$(jq -c -n '[inputs] as $files | ($files[0] - $files[1]) | map(.version)' new/versions.json old/versions.json)
          sample='[]'
          if [[ "$DOCKERFILE_CHANGED" == "true" ]]; then
            sample=$(jq -c 'map(.version) | group_by(split(".")[0] | tonumber) | map(sort_by(split(".") | map(tonumber)) | [first, last]) | flatten' new/versions.json)
          fi
          matrix=$(jq -c -n --argjson changed "$changed" --argjson sample "$sample" '$changed + $sample | unique | map({ version: . })')
          if [[ "$matrix" == "[]" ]]; then
            echo "No new or changed versions found."
            exit 1
          fi
          echo "Building: $(jq -r 'map(.version) | join(", ")' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Get safe ref name
        id: safeRefName
        run: |
          ref=${{github.ref}}
          echo "REF=${ref//\//-}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test v${{matrix.version.version }} on ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
    needs: configure
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        version: ${{ fromJson(needs.configure.outputs.matrix) }}
        platform:
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Fetch Node.js tarball
        id: node-dist
        uses: ./.github/actions/node-dist
        with:
          version: ${{ matrix.version.version }}
          arch: ${{ matrix.platform.arch }}

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4

      - name: Build Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          load: true
          push: false
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            NODE_DIST_URL=${{ steps.node-dist.outputs.url }}
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          cache-to: type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{matrix.version.version}}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{needs.configure.outputs.safeRefName}},mode=max
          tags: |
            nvitaterna/nodejs-distroless:${{ matrix.version.version }}
          cache-from: |
            type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{matrix.version.version}}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{needs.configure.outputs.safeRefName}}
            type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{matrix.version.version}}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
      - name: Test Docker image
        run: |
          docker run --platform ${{ matrix.platform.os }}/${{ matrix.platform.arch }} --rm nvitaterna/nodejs-distroless:${{ matrix.version.version }} --version | grep -q "v${{ matrix.version.version }}"
