name: Build and test new or changed versions

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
    paths:
      - versions.json
      - Dockerfile
      - test/**
      - .github/workflows/pr-build-and-test.yml
      - .github/actions/**

# cancel in-progress runs for the same PR when a newer run starts
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  configure:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      safeRefName: ${{ steps.safeRefName.outputs.REF }}
    steps:
      - name: Get changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: changes
        with:
          filters: |
            dockerfile:
              - 'Dockerfile'
              - 'test/**'
              - '.github/workflows/pr-build-and-test.yml'
              - '.github/actions/**'
      - name: Checkout current ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: "./new"
      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: "./old"
      # always build new and changed versions; when the Dockerfile changes also
      # build the oldest and newest version of each major instead of every
      # version (the publish workflows still build every version they release)
      - name: Set matrix data
        id: set-matrix
        env:
          DOCKERFILE_CHANGED: ${{ steps.changes.outputs.dockerfile }}
        run: |
          changed=$(jq -c -n '[inputs] as $files | ($files[0] - $files[1]) | map(.version)' new/versions.json old/versions.json)
          sample='[]'
          if [[ "$DOCKERFILE_CHANGED" == "true" ]]; then
            sample=$(jq -c 'map(.version) | group_by(split(".")[0] | tonumber) | map(sort_by(split(".") | map(tonumber)) | [first, last]) | flatten' new/versions.json)
          fi
          matrix=$(jq -c -n --argjson changed "$changed" --argjson sample "$sample" '$changed + $sample | unique | map({ version: . })')
          if [[ "$matrix" == "[]" ]]; then
            echo "No new or changed versions found."
            exit 1
          fi
          echo "Building: $(jq -r 'map(.version) | join(", ")' <<< "$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Get safe ref name
        id: safeRefName
        run: |
          ref=${{github.ref}}
          echo "REF=${ref//\//-}" >> "$GITHUB_OUTPUT"

  base:
    name: Build base on ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
    needs: configure
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # built once per arch and handed to every version build as an OCI
      # layout, same as the publish workflow; this is the slow part on arm64
      - name: Build base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          target: base
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/base-oci
          cache-to: type=registry,ref=nvitaterna/buildcache:${{ vars.REGISTRY_IMAGE }}-base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ needs.configure.outputs.safeRefName }},mode=max
          cache-from: |
            type=registry,ref=nvitaterna/buildcache:${{ vars.REGISTRY_IMAGE }}-base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{ needs.configure.outputs.safeRefName }}
            type=registry,ref=nvitaterna/buildcache:${{ vars.REGISTRY_IMAGE }}-base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}

      - name: Upload base
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/base-oci
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build and test v${{matrix.version.version }} on ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
    needs:
      - configure
      - base
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        version: ${{ fromJson(needs.configure.outputs.matrix) }}
        platform:
          - os: linux
            arch: arm64
          - os: linux
            arch: amd64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch Node.js tarball
        id: node-dist
        uses: ./.github/actions/node-dist
        with:
          version: ${{ matrix.version.version }}
          arch: ${{ matrix.platform.arch }}

      - name: Download base
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: base-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/base-oci

      - name: Resolve base
        id: base
        env:
          BASE_OCI: ${{ runner.temp }}/base-oci
        run: |
          digest=$(jq -r '.manifests[0].digest' "$BASE_OCI/index.json")
          echo "context=base=oci-layout://$BASE_OCI@$digest" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          load: true
          push: false
          build-args: |
            NODE_VERSION=${{ matrix.version.version }}
            NODE_DIST_URL=${{ steps.node-dist.outputs.url }}
          build-contexts: ${{ steps.base.outputs.context }}
          platforms: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          cache-to: type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{matrix.version.version}}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{needs.configure.outputs.safeRefName}},mode=max
          tags: |
            nvitaterna/nodejs-distroless:${{ matrix.version.version }}
          cache-from: |
            type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{matrix.version.version}}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}-${{needs.configure.outputs.safeRefName}}
            type=registry,ref=nvitaterna/buildcache:${{vars.REGISTRY_IMAGE}}-${{matrix.version.version}}-${{ matrix.platform.os }}-${{ matrix.platform.arch }}
      - name: Test Docker image
        env:
          PLATFORM: ${{ matrix.platform.os }}/${{ matrix.platform.arch }}
          IMAGE: nvitaterna/nodejs-distroless:${{ matrix.version.version }}
          EXPECTED_NODE_VERSION: ${{ matrix.version.version }}
        run: |
          docker run --platform "$PLATFORM" --rm \
            -v "$PWD/test/check.js:/check.js:ro" \
            -e EXPECTED_NODE_VERSION \
            "$IMAGE" /check.js
