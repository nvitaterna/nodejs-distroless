name: Check for new nodejs versions

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check_versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write # delete assets from the node-dist release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # pushes made with the PAT trigger the publish workflow;
          # pushes made with GITHUB_TOKEN would not
          token: ${{ secrets.PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12
          package_json_file: tools/version-info/package.json

      - name: Fetch new versions
        working-directory: tools/version-info
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # versions.json: already-published versions are not re-checked against nodejs.org
          node dist ../../versions.json > ../../new.versions.json

      - name: Compare versions
        id: set-versions
        run: |
          echo "versions=$(jq -c -n '[inputs] as $files | ($files[0] - $files[1])' new.versions.json versions.json)" >> "$GITHUB_OUTPUT"

      # nodejs.org's listing is served from a CDN cache, so a run can see an
      # older listing than the previous one did. Versions only legitimately
      # disappear when their whole line reaches end of life.
      - name: Refuse to drop versions of a line that is still published
        run: |
          dropped=$(jq -c -n '
            [inputs] as $files
            | ($files[0] | map(.version)) as $new
            | ($files[1] | map(.version)) as $old
            | ($new | map(split(".")[0]) | unique) as $lines
            | ($old - $new) | map(select(split(".")[0] as $line | $lines | index($line)))
          ' new.versions.json versions.json)
          if [[ "$dropped" != "[]" ]]; then
            echo "::error::Versions missing from nodejs.org's index: $dropped. Stale listing? Not committing."
            exit 1
          fi

      - name: Check if new versions exist and set output
        id: check-versions
        run: |
          if [[ "${{ steps.set-versions.outputs.versions }}" == "" || "${{ steps.set-versions.outputs.versions }}" == "[]" ]]; then
            echo "No new versions found."
            echo "new_versions=false" >> "$GITHUB_OUTPUT"
          else
            echo "New versions found."
            echo "new_versions=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Map versions output to comma-separated string
        if: steps.check-versions.outputs.new_versions == 'true'
        id: set-versions-string
        run: |
          echo "versions=$(jq -r '. | map(.version) | join(", ")' <<< '${{ steps.set-versions.outputs.versions }}')" >> "$GITHUB_OUTPUT"

      - name: Overwrite versions.json with new.versions.json
        if: steps.check-versions.outputs.new_versions == 'true'
        run: |
          mv new.versions.json versions.json

      # open (or refresh) a pull request and let GitHub auto-merge it once the
      # required checks pass: the PR workflow builds and smoke-tests the new
      # version on both arches, so a broken upstream release never reaches
      # main. The PAT is used so that the PR triggers workflows and the
      # resulting merge triggers the publish workflow.
      - name: Open an auto-merging pull request
        if: steps.check-versions.outputs.new_versions == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          VERSIONS: ${{ steps.set-versions-string.outputs.versions }}
          BRANCH: new-versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add versions.json
          git commit -m "chore(node): add new version(s)" -m "versions: $VERSIONS"
          git push --force origin "$BRANCH"
          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --head "$BRANCH" --base main \
              --title "chore(node): add new version(s)" \
              --body "New Node.js version(s): $VERSIONS. Opened by the hourly version check; merges on its own once the image builds pass."
          else
            gh pr edit "$BRANCH" --body "New Node.js version(s): $VERSIONS. Opened by the hourly version check; merges on its own once the image builds pass."
          fi
          gh pr merge "$BRANCH" --auto --squash

      # the node-dist release caches one tarball per version and arch (see
      # .github/actions/node-dist); drop the ones for versions that are no
      # longer published so the release doesn't grow forever
      - name: Prune cached tarballs of versions no longer published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view node-dist --json assets -q '.assets[].name' > assets.txt; then
            echo "No node-dist release yet; nothing to prune."
            exit 0
          fi
          jq -r '.[].version' versions.json > published.txt
          while read -r asset; do
            [[ "$asset" =~ ^node-v([0-9]+\.[0-9]+\.[0-9]+)-linux-(x64|arm64)\.tar\.xz$ ]] || continue
            version="${BASH_REMATCH[1]}"
            if ! grep -qx "$version" published.txt; then
              echo "Deleting $asset: $version is no longer published"
              gh release delete-asset node-dist "$asset" --yes
            fi
          done < assets.txt
